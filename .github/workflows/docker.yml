name: Docker amd64

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl php-mbstring php-xml php-sqlite3
          npm ci --no-audit --no-fund
          python -m pip install -r engine/spider/py/base/requirements.txt
          npm run check
          npm run build
          npm test
        env:
          TEST_PYTHON: python
          TEST_PHP: php
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@v3
      - name: Build x86-64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Empty-container smoke test
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          # 镜像必须声明非 root 运行用户，防止回退到 root。
          test -n "$(docker image inspect "$IMAGE_NAME:sha-${GITHUB_SHA:0:7}" --format '{{.Config.User}}')"
          docker run -d --name coketv-smoke "$IMAGE_NAME:sha-${GITHUB_SHA:0:7}"
          for attempt in $(seq 1 60); do
            if docker exec coketv-smoke node -e "fetch('http://127.0.0.1:54058/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then break; fi
            sleep 2
          done
          docker exec coketv-smoke node scripts/container-smoke.mjs
          docker rm -fv coketv-smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] || docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Build logs on failure
        if: failure()
        run: docker logs coketv-smoke || true
      - name: Clean smoke container
        if: always()
        run: docker rm -fv coketv-smoke || true

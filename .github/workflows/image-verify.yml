name: Verify published image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Published fixed SHA tag or digest to pull and verify
        required: true
        default: ghcr.io/tardlk/coketv:latest

permissions:
  contents: read

jobs:
  verify-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull published x86 image anonymously
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Full published-image matrix
        env:
          IMAGE: ${{ inputs.image }}
          CONTAINER_REPORT_DIR: ${{ runner.temp }}/container-report
        run: node scripts/container-matrix.mjs "$IMAGE"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-image-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/container-report/
          if-no-files-found: warn
          retention-days: 7

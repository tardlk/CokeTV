services:
  coketv:
    image: ghcr.io/tardlk/coketv:latest
    platform: linux/amd64
    ports:
      - "54058:54058"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # 管理密码只在首次进入 /admin 时创建；观影首页无需密码。
      # 也可设置 ADMIN_PASSWORD 跳过首装引导（推荐用于无人值守部署）。
    restart: unless-stopped
    stop_grace_period: 15s
    # 容器以非 root（node）运行，并裁剪权限：源脚本与 CokeTV 同权限执行，
    # 这些开关能显著缩小被恶意源利用后的影响面。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ffmpeg / chromium 版若需要额外内核能力，请按需在此恢复最小集合。

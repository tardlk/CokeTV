services:
  coketv:
    image: ghcr.io/tardlk/coketv:latest
    platform: linux/amd64
    ports:
      - "54058:54058"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # 管理密码只在首次进入 /admin 时创建；观影首页无需密码。
      # 尚未创建密码时，可在此显式配置 ADMIN_PASSWORD 预设管理密码；不覆盖已有密码。
      # 主机 .env 的变量不会自动全部传入容器，需要在 environment 中声明。
    restart: unless-stopped
    stop_grace_period: 15s
    # 容器以非 root（node）运行，并裁剪权限：源脚本与 CokeTV 同权限执行，
    # 这些开关能显著缩小被恶意源利用后的影响面。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ffmpeg / chromium 版若需要额外内核能力，请按需在此恢复最小集合。
